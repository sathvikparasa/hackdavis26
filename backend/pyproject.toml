[project]
name = "yologuard-backend"
version = "0.1.0"
description = "FastAPI backend for YoloGuard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.124.2",
    "google-genai",
    "httpx==0.28.1",
    "psycopg[binary]",
    "pydantic==2.12.5",
    "python-dotenv",
    "python-multipart",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
